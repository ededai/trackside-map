<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRACKSIDE — Motion Prototype</title>
<style>
/* ==========================================================================
   TRACKSIDE — GREY BOX MOTION PROTOTYPE  (v3, rebuilt from Ed's floor plans)
   Millenia Walk, Singapore. 3-day car festival.
   Purpose: judge CAMERA MOTION + INTERACTION only. Style is deliberately null.
   Zero external resources except props.js. Vanilla JS + CSS 3D.
   --------------------------------------------------------------------------
   WORLD ORIENTATION (v3): the indoor spine runs WEST -> EAST across the plan.
   Everything is axis-aligned, so no rotated sub-plans are needed and the box
   side-quad pair can be swapped globally by camera quadrant (see .f.sy/.f.sx).
   ========================================================================== */

/* --- registered custom props so dim / x-ray transitions interpolate ------ */
@property --os { syntax: '<number>'; inherits: true; initial-value: 1; }  /* surface  (x-ray) */
@property --oz { syntax: '<number>'; inherits: true; initial-value: 1; }  /* zone     (dim)   */
@property --ol { syntax: '<number>'; inherits: true; initial-value: 1; }  /* leaf-local       */

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: #ffffff;
  color: #24282c;
  font: 400 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  overscroll-behavior: none;
}

/* ========================= STAGE / CAMERA ================================ */
#stage {
  position: fixed; inset: 0; overflow: hidden;
  user-select: none; -webkit-user-select: none;
  perspective: 3600px; perspective-origin: 50% 50%;
  background:
    radial-gradient(120% 90% at 50% 30%, #ffffff 0%, #fafafb 55%, #f2f3f4 100%);
  touch-action: none;                 /* drag-to-orbit owns the whole gesture */
}
/* grab / grabbing affordance is a DESKTOP-only cue: on touch there is no
   cursor and `hover:none` devices must not inherit a pointer style. */
@media (hover: hover) and (pointer: fine) {
  #stage { cursor: grab; }
  body.dragging #stage { cursor: grabbing; }
}
/* #camera is a zero-size point at the stage centre. It carries pan + zoom. */
#camera {
  position: absolute; left: 50%; top: 50%; width: 0; height: 0;
  transform-style: preserve-3d;
  will-change: transform;
}
/* #world is the plan, offset so its centre sits on the camera point.
   It carries only the isometric rotation (rx / rz).                        */
#world {
  position: absolute; left: -720px; top: -470px; width: 1440px; height: 940px;
  transform-style: preserve-3d;
  will-change: transform;
}

/* ========================= GENERIC 3D BOX ================================ */
/* A box = plan rect (left/top/width/height) + --h extrusion.
   Only TWO side quads are ever built — the pair nearest the camera. Which
   pair that is depends on the camera rz quadrant, so the frame loop stamps
   `wall-n` / `wall-e` on <body> and the two quads simply re-hinge:

     rz in (-90,  0) : south + west   (no class)   <- default iso pose
     rz in (  0, 90) : south + east   (wall-e)     <- "45 flip" preset
     rz in ( 90,180) : north + east   (wall-n wall-e)
     rz in (-180,-90): north + west   (wall-n)

   This keeps every box reading as a solid volume through a full 360 orbit
   without doubling the quad count or creating coplanar z-fighting pairs.   */
.box  { position: absolute; transform-style: preserve-3d; }
.f, .flat, .lbl, .mark, .kart, .rc, .fade {
  opacity: calc(var(--os, 1) * var(--oz, 1) * var(--ol, 1));
  transition: opacity .55s cubic-bezier(.4,0,.2,1);
}
.f { position: absolute; display: block; background: var(--faceA, #bcc0c4); }
.f.top { left: 0; top: 0; width: 100%; height: 100%;
         transform: translateZ(var(--h)); background: var(--faceT, #d2d5d8); }
.f.sy  { left: 0; top: 100%; width: 100%; height: var(--h);
         transform-origin: 50% 0%;  transform: rotateX(90deg);
         background: var(--faceA, #b3b7bb); }
.f.sx  { left: 0; top: 0; width: var(--h); height: 100%;
         transform-origin: 0% 50%;  transform: rotateY(-90deg);
         background: var(--faceB, #c4c8cb); }
body.wall-n .f.sy { top: 0; }        /* hinge on the north edge instead */
body.wall-e .f.sx { left: 100%; }    /* hinge on the east edge instead  */

/* flat = anything lying on a ground plane (slabs, roads, pens, shadows) */
.flat { position: absolute; display: block; background: #e6e8e9; }
.shd  { position: absolute; display: block; background: rgba(30,36,42,.055);
        border-radius: 10px; box-shadow: 0 0 26px 14px rgba(30,36,42,.045);
        opacity: calc(var(--os,1) * var(--oz,1)); transition: opacity .55s ease; }

/* ========================= GROUND ======================================== */
#gGround { position: absolute; inset: 0; transform-style: preserve-3d; }
.plaza   { background: #ececee; border-radius: 4px; }
.road    { background: #dcdee0; }
.roadline{ background: repeating-linear-gradient(90deg,
             rgba(255,255,255,.85) 0 26px, transparent 26px 56px); }
.sqslab  { background: #e3e5e7; border-radius: 3px; transform: translateZ(3px); }
.walk    { background: #e6e8ea; border-radius: 3px; }

/* ------------------------------------------------------------------------
   GROUND-PLANE Z STACK (nothing coplanar, so nothing z-fights):
     0   outdoor plaza          3  spine street / sqslab / walk
     1   roads, park grid       4  spine centre line
     2   building plate         5  galleria floor, Great Hall pad, escalators
   ------------------------------------------------------------------------ */

/* ========================= MALL / GREAT HALL ============================= */
#gMall { position: absolute; inset: 0; transform-style: preserve-3d; }
.bldg     { background: #e9ebed; border-radius: 4px; transform: translateZ(2px); }
.spine    { background: #f1f2f3; border-radius: 3px; }
.spineline{ background: repeating-linear-gradient(90deg,
              rgba(160,168,175,.35) 0 20px, transparent 20px 46px); }
.oct      { clip-path: polygon(29.3% 0, 70.7% 0, 100% 29.3%, 100% 70.7%,
                               70.7% 100%, 29.3% 100%, 0 70.7%, 0 29.3%); }
.pyr        { position: absolute; transform-style: preserve-3d; }
.pyr .arm   { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
              transform-style: preserve-3d; transform-origin: 50% 50%; }
.pyr .face  { position: absolute; left: 0; top: 0; width: 100%;
              height: var(--slant); transform-origin: 50% 0%;
              transform: rotateX(var(--tilt));
              clip-path: polygon(0 0, 100% 0, 50% 100%);
              background: rgba(176,181,186,.42);
              border-top: 1px solid rgba(120,127,134,.5);
              opacity: calc(var(--os,1) * var(--oz,1));
              transition: opacity .55s ease; }

/* ========================= LABELS (billboarded) ========================== */
/* Counter-rotate the world rotation so labels always face the screen, and
   counter-scale the camera zoom so they never overflow their pill.
   The counter-transform is rotateZ(-rz) rotateX(-rx), applied INSIDE the
   world's rotateX(rx) rotateZ(rz) — the product is exactly the identity, so
   the billboarding is angle-independent and holds at any rx, including the
   near-top-down bird's eye preset and a fully dragged rz.
   --crzx is the extra counter-spin a ROTATED SUB-PLAN container hands down to
   its own labels (a `grp` of spin -32deg sets --crzx:32deg).                */
.lbl {
  position: absolute; left: 0; top: 0; width: 0; height: 0;
  transform-style: preserve-3d;
  transform: translateZ(var(--lz, 4px))
             rotateZ(calc(var(--crz, 38deg) + var(--crzx, 0deg)))
             rotateX(var(--crx, -58deg))
             scale(calc(1 / var(--cs, .6)));
  pointer-events: none;
}
.lbl > span {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
  white-space: nowrap;
  font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
  font-weight: 600; color: #4a5157;
  background: rgba(255,255,255,.86);
  border: 1px solid rgba(0,0,0,.07);
  border-radius: 999px; padding: 3px 8px;
}
.lbl.sm  > span { font-size: 8.5px; padding: 2px 6px; letter-spacing: .06em;
                  color: #6a7278; font-weight: 500; }
.lbl.anchor > span { color: #4b3d74; border-color: rgba(107,79,178,.28);
                     background: rgba(247,244,255,.92); }
.lbl.det { opacity: 0; transition: opacity .45s ease; }
body.z-near .lbl.det { opacity: calc(var(--os,1) * var(--oz,1)); }
body.z-far .lbl.sm { opacity: 0; }

/* ========================= MICRO-ANIMATIONS ============================== */
/* All keyframes are transform / opacity only. */
@keyframes lap      { 0% { offset-distance: 0%; } 100% { offset-distance: 100%; } }
@keyframes crowd    { 0%,100% { transform: translate(0,0) scale(1); }
                      50%     { transform: translate(5px,-4px) scale(1.25); } }
@keyframes blink    { 0%, 88%, 100% { opacity: .18; } 92% { opacity: 1; } }
@keyframes screenPulse { 0%,100% { opacity: .30; transform: scale(1); }
                         50%     { opacity: .80; transform: scale(1.015); } }
/* transform-only pulse: opacity stays under the --os/--oz/--ol calc so the
   ring still obeys x-ray and zone dimming. */
@keyframes liftPulse { 0%,100% { transform: translateZ(5.2px) scale(.84); }
                       50%     { transform: translateZ(5.2px) scale(1.08); } }

/* --- Dorifto karts + trails --- */
.kartset { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
/* karts are 1.4x the v3 size (17x9 -> 24x13) so the driver reads at zone zoom */
.kart {
  position: absolute; left: 0; top: 0; width: 24px; height: 13px;
  margin: -6.5px 0 0 -12px; border-radius: 4px;
  background: var(--accent, #7d848a);
  offset-path: var(--path);
  offset-rotate: auto var(--drift, 22deg);   /* yaw held ahead of travel = drift */
  animation: lap var(--dur, 19s) linear infinite;   /* ~60% of v3 ground speed */
  animation-delay: var(--dly, 0s);
  will-change: transform;
}
/* --- kart driver -----------------------------------------------------------
   .kart carries an opacity (the --os/--oz/--ol calc), which makes it a
   GROUPING element — every child is flattened into the kart's own plane, so
   translateZ here would do nothing. The driver is therefore drawn as two flat
   overlays on the shell: a shoulder pad and a helmeted head disc. Because the
   kart plane is already billboard-free (it lies on the road and yaws with
   offset-rotate), this reads as a seated driver from every camera pose, and
   the trail ghosts inherit it at their own --ol so the trails still work. */
.kart > i { position: absolute; display: block; }
.kart > i.drv-s { left: 6px; top: 1.5px; width: 10px; height: 10px;
                  border-radius: 4px; background: rgba(44,50,56,.55); }
.kart > i.drv-h { left: 8.5px; top: 3.5px; width: 6px; height: 6px;
                  border-radius: 50%; background: var(--helm, #eef1f3);
                  box-shadow: 0 0 0 1px rgba(20,26,32,.38); }
.kart.t1 { --ol: .40; transform-box: fill-box; }
.kart.t2 { --ol: .22; }
.kart.t3 { --ol: .11; }
.kart.t4 { --ol: 0;  }                      /* revealed only when amplified  */
.kart.lead { --ol: 1; background: var(--accent, #5d656c); filter: brightness(.8) saturate(1.15); }
.kart.lead::after {                          /* nose highlight, clear of the driver */
  content: ''; position: absolute; right: 2px; top: 3px; width: 5px; height: 7px;
  border-radius: 2px; background: rgba(255,255,255,.5);
}
.zone.is-active .kart          { --dur: 13.4s; }
.zone.is-active .kart.t1       { --ol: .55; }
.zone.is-active .kart.t2       { --ol: .36; }
.zone.is-active .kart.t3       { --ol: .22; }
.zone.is-active .kart.t4       { --ol: .11; }

/* --- RC circuit cars --- */
.rc {
  position: absolute; left: 0; top: 0; width: 11px; height: 6px;
  margin: -3px 0 0 -5.5px; border-radius: 2px; background: var(--accent, #767d84);
  offset-path: var(--path); offset-rotate: auto;
  animation: lap var(--dur, 5.2s) linear infinite;
  animation-delay: var(--dly, 0s);
  will-change: transform;
}
.zone.is-active .rc { --dur: 3.9s; }

/* --- people dots --- */
.dotwrap { position: absolute; width: 0; height: 0;
           opacity: calc(var(--os,1) * var(--oz,1)); transition: opacity .55s ease; }
.dot     { position: absolute; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
           border-radius: 50%; background: #9aa1a7;
           animation: crowd var(--dur, 9s) ease-in-out infinite;
           animation-delay: var(--dly, 0s); will-change: transform; }

/* --- big screen glow --- */
.glowpanel { position: absolute; inset: 0; background: var(--accent, #888);
             animation: screenPulse 3.4s ease-in-out infinite; }
.zone.is-active .glowpanel { animation-duration: 1.9s; }

/* --- stall blink --- */
.blink { position: absolute; width: 4px; height: 4px; margin: -2px 0 0 -2px;
         border-radius: 50%; background: var(--accent, #888);
         animation: blink var(--dur, 7s) linear infinite;
         animation-delay: var(--dly, 0s); }

/* ========================= ZONE SELECTION GLOW =========================== */
.zone { position: absolute; transform-style: preserve-3d; }
.zglow { position: absolute; left: -14px; top: -14px; right: -14px; bottom: -14px;
         border: 1.5px solid var(--accent); border-radius: 8px;
         box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 12%, transparent),
                     0 0 34px 6px color-mix(in srgb, var(--accent) 26%, transparent);
         opacity: 0; transition: opacity .5s ease; pointer-events: none;
         transform: translateZ(2px); }
.zone.is-active .zglow { opacity: .95; }
svg.zglowsvg { position: absolute; left: 0; top: 0; overflow: visible;
               opacity: 0; transition: opacity .5s ease; transform: translateZ(2px); }
.zone.is-active svg.zglowsvg { opacity: .95; }

/* ========================= LIFT LOBBY A — LEVEL LINK ===================== */
.liftlink { cursor: pointer; }
.liftlink .f { transition: background .25s ease, opacity .55s cubic-bezier(.4,0,.2,1); }
.liftlink:hover .f.top { background: #cdd8ea; }
.liftring { background: radial-gradient(closest-side,
              rgba(77,124,214,.55) 0%, rgba(77,124,214,.18) 62%, transparent 100%);
            border-radius: 50%; --ol: .75;
            animation: liftPulse 2.6s ease-in-out infinite; pointer-events: none; }

/* glowing vertical shaft shown during a level change */
.shaft      { --ol: 0; transition: --ol .9s cubic-bezier(.25,.6,.35,1);
              pointer-events: none; }
.shaft.snap { transition: none; }
.shaft.lit  { --ol: 1; }
.shaft .f   { transition: none; }

/* ========================= B1 =========================================== */
/* NOTE: never put `opacity` on a preserve-3d group — it becomes a grouping
   element and flattens every child's 3D. Both the x-ray fade and the basement
   reveal are driven through the inherited --os number instead, applied on the
   flat leaf quads, so the extrusions survive the transition.               */
#gSurface { --os: 1; transition: --os .6s cubic-bezier(.4,0,.2,1); }
#gB1 { position: absolute; inset: 0; transform-style: preserve-3d;
       transform: translateZ(-95px);
       --os: 0; transition: --os .6s cubic-bezier(.4,0,.2,1); }
body.xray #gB1      { --os: 1; }
body.xray #gSurface { --os: .12; }
.b1slab  { background: #e0e2e4; border-radius: 3px; }
.parkgrid{ background:
   repeating-linear-gradient(90deg, rgba(140,148,156,.20) 0 1px, transparent 1px 46px),
   repeating-linear-gradient(0deg,  rgba(140,148,156,.14) 0 1px, transparent 1px 92px); }
.driftfloor { background: #d7dadd; border-radius: 3px; }
.mark { position: absolute; display: block; }
.mcpark { background: repeating-linear-gradient(45deg,
            rgba(150,156,162,.34) 0 4px, transparent 4px 9px); border-radius: 2px; }
.carpad { background: #cfd3d7; border-radius: 4px;
          box-shadow: inset 0 0 0 1px rgba(120,128,136,.20); }
.loungepad { background: #dde1e4; border-radius: 5px; }

/* ==========================================================================
   HUD — PHONE-FIRST
   --------------------------------------------------------------------------
   PRIMARY layout = portrait phone (attendees scan a QR at the mall).
   Base CSS below IS the phone layout: compact title pill at the top, the view
   preset cluster + a horizontally scrollable chip bar pinned to the bottom in
   thumb reach with 46px minimum tap targets, and an info card that slides UP
   from the bottom and sits directly above the dock.
   SECONDARY layout = desktop left panel (+ preset cluster top-right).
   ========================================================================== */
#hud { display: contents; }

/* ---- compact title at the top ---- */
#brand {
  position: fixed; left: 50%; top: 10px; transform: translateX(-50%);
  z-index: 30; text-align: center; max-width: calc(100vw - 24px);
  background: rgba(255,255,255,.92);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border: 1px solid rgba(0,0,0,.08); border-radius: 999px;
  padding: 7px 16px;
  box-shadow: 0 8px 26px -18px rgba(20,26,32,.5);
}
#brand h1 { margin: 0; font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
            font-weight: 700; color: #1d2226;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#brand .sub { display: none; margin: 2px 0 0; font-size: 10.5px; color: #8b9299;
              letter-spacing: .03em; }

/* ---- bottom dock: view presets + chip bar ---- */
#dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: rgba(255,255,255,.93);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-top: 1px solid rgba(0,0,0,.08); border-radius: 16px 16px 0 0;
  padding: 9px 10px calc(10px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -12px 34px -22px rgba(20,26,32,.55);
}
/* ---- view preset cluster ----
   Deliberately a SIBLING of #hud, not a child of #dock: on desktop #hud gets a
   backdrop-filter, which would make it the containing block for any fixed
   descendant and pin this cluster inside the left panel instead of the corner. */
#views {
  position: fixed; z-index: 31;
  left: 50%; transform: translateX(-50%);
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 4px; padding: 3px;
  border-radius: 10px;
  background: rgba(255,255,255,.93);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border: 1px solid rgba(0,0,0,.08);
  box-shadow: 0 8px 26px -18px rgba(20,26,32,.5);
}
.vbtn {
  flex: 1 1 0; min-height: 34px; padding: 5px 4px; white-space: nowrap;
  font: inherit; font-size: 11.5px; font-weight: 600; color: #6a7178;
  background: transparent; border: 0; border-radius: 7px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background .18s ease, color .18s ease;
}
.vbtn.on { background: #fff; color: #1d2226;
           box-shadow: 0 1px 3px rgba(20,26,32,.17); }
#chips {
  display: flex; flex-direction: row; gap: 7px; list-style: none; margin: 0;
  padding: 0 2px 3px; overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity;
  scrollbar-width: none;
}
#chips::-webkit-scrollbar { display: none; }
#chips > li { flex: 0 0 auto; scroll-snap-align: center; }
.chip {
  display: flex; align-items: center; gap: 9px; min-height: 46px; max-width: 62vw;
  text-align: left; font: inherit; color: #2c3237; cursor: pointer;
  background: rgba(0,0,0,.025); border: 1px solid rgba(0,0,0,.10); border-radius: 10px;
  padding: 8px 13px; -webkit-tap-highlight-color: transparent;
  transition: background .18s ease, border-color .18s ease, transform .18s ease;
}
.chip:active { transform: scale(.97); }
.chip.on { background: #24282c; border-color: #24282c; color: #fff; }
.chip .swatch { flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%;
                background: var(--accent, #b9bec3);
                box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.chip .txt { min-width: 0; }
.chip .nm  { display: block; font-size: 12.5px; font-weight: 600; line-height: 1.25;
             white-space: nowrap; }
.chip .ds  { display: none; font-size: 10px; color: #868d94; line-height: 1.35;
             margin-top: 1px; overflow-wrap: anywhere; }
.chip.on .ds { color: #b9c0c6; }

/* ---- info card: slides up from the bottom, above the dock ---- */
#card {
  position: fixed; left: 10px; right: 10px; z-index: 29;
  bottom: calc(126px + env(safe-area-inset-bottom, 0px));
  background: rgba(255,255,255,.95);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border: 1px solid rgba(0,0,0,.08); border-radius: 14px; padding: 13px 14px 12px;
  box-shadow: 0 16px 40px -22px rgba(20,26,32,.6);
  opacity: 0; transform: translateY(28px); pointer-events: none;
  transition: opacity .38s cubic-bezier(.4,0,.2,1), transform .38s cubic-bezier(.4,0,.2,1);
}
#card.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
#card .kicker { display: flex; align-items: center; gap: 7px; font-size: 9.5px;
                letter-spacing: .12em; text-transform: uppercase; color: #949ba1; }
#card .kicker i { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%;
                  background: var(--accent, #b9bec3); }
#card h2 { margin: 6px 0 8px; font-size: 16px; line-height: 1.22; font-weight: 700; color: #191d21; }
#card ul { margin: 0; padding: 0 0 0 15px; }
#card li { font-size: 12.5px; line-height: 1.45; color: #5c646b; margin-bottom: 3px;
           overflow-wrap: anywhere; }

/* ---- landscape phone: keep the dock compact ---- */
@media (max-height: 520px) and (max-width: 899px) {
  #dock { padding-top: 7px; }
  #views { bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
  .vbtn { min-height: 28px; font-size: 11px; }
  #card { bottom: calc(116px + env(safe-area-inset-bottom, 0px)); padding: 10px 12px; }
  #card li { font-size: 11.5px; }
}

/* ==========================================================================
   SECONDARY LAYOUT — desktop / large viewport: left panel, preset cluster
   top-right, card bottom-right
   ========================================================================== */
@media (min-width: 900px) and (min-height: 560px) {
  #hud {
    display: block; position: fixed; left: 22px; top: 22px; width: 264px; z-index: 30;
    background: rgba(255,255,255,.92);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid rgba(0,0,0,.08); border-radius: 12px;
    padding: 15px 15px 13px;
    box-shadow: 0 10px 34px -18px rgba(20,26,32,.5);
  }
  #brand, #dock {
    position: static; transform: none; max-width: none;
    background: none; border: 0; border-radius: 0; padding: 0; box-shadow: none;
    -webkit-backdrop-filter: none; backdrop-filter: none;
  }
  #brand { text-align: left; margin-bottom: 12px; }
  #brand h1 { font-size: 13px; letter-spacing: .14em; white-space: normal; }
  #brand .sub { display: block; }
  /* the preset cluster moves from above the chip bar to the top-right corner */
  #views {
    top: 22px; right: 22px; left: auto; bottom: auto;

<script>

    tx: -210, ty:-174, scale: 1.30, rz: -38, rx: 58, xray:true,  zone:null }

/* ==========================================================================
   2.  DOM HELPERS
   ========================================================================== */
var world  = document.getElementById('world');
var camera = document.getElementById('camera');
var stage  = document.getElementById('stage');

function el(cls, style, parent) {
  var d = document.createElement('div');
  if (cls)   d.className = cls;
  if (style) d.setAttribute('style', style);
  (parent || world).appendChild(d);
  return d;
}
function rect(parent, cls, x, y, w, h, extra) {
  return el('flat ' + (cls || ''),
    'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;' + (extra || ''),
    parent);
}
/* 3D box: plan rect + extrusion height z */
function box(parent, x, y, w, h, z, extra) {
  var b = el('box', 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h +
                    'px;--h:' + z + 'px;' + (extra || ''), parent);
  b.innerHTML = '<i class="f top"></i><i class="f sy"></i><i class="f sx"></i>';

}
/* soft ground shadow for a footprint */
function shadow(parent, x, y, w, h) {
  return el('shd', 'left:' + (x - 10) + 'px;top:' + (y + 12) + 'px;width:' + (w + 16) +

function label(parent, x, y, z, text, cls) {
  var d = el('lbl ' + (cls || ''),
    'left:' + x + 'px;top:' + y + 'px;--lz:' + z + 'px', parent);
  d.innerHTML = '<span></span>';
  d.firstChild.textContent = text;
  return d;
}
/* ROTATED SUB-PLAN: a positioned preserve-3d container spun about its own
   centre. Children keep using rect / box / label / shadow in the container's
   LOCAL coordinates. --crzx hands the labels the counter-spin they need.
   The v3 plan is axis-aligned so nothing here uses it, but props.js is handed
   the helper for angled furniture. Keep spins shallow: the global wall-quadrant
   swap is driven by the CAMERA rz only, so a container spun far off axis can
   show the wrong side pair.                                                 */
function grp(parent, cx, cy, w, h, deg) {
  return el('grp',
    'position:absolute;left:' + (cx - w / 2) + 'px;top:' + (cy - h / 2) + 'px;width:' + w +
    'px;height:' + h + 'px;transform-style:preserve-3d;transform:rotateZ(' + deg + 'deg);' +
    '--crzx:' + (-deg) + 'deg', parent);
}
function svgNS(tag, attrs, parent) {

  return n;
}
function rnder(seed) {                      /* deterministic 0..1 generator */
  var s = seed;
  return function () { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}

/* ---- props.js bridge ----------------------------------------------------

  return (hasProps && typeof PR[name] === 'function') ? PR[name] : null;

/* ==========================================================================

   --------------------------------------------------------------------------

     x   80 -  550   ACTIVATION REGION, top-left quadrant of the car park

                                     down the WEST edge. Inside it, a drift
                                     COURSE: donut circle south, figure-8 north

(function () {

/* 4A — SIX MiniMe FPV rigs with seated drivers, 3 along each side, ringing a

rect(zDrift, 'driftfloor', 0, 150, 150, 215, 'transform:translateZ(2px)');

/* ---- THE COURSE ---------------------------------------------------------
   Read it in travel order from the crossing point X (220,75):

     1  X -> (384,75) -> X      the figure-8's RIGHT loop, over the top and
                                back under, filling the east of the horiz arm
     2  X -> (50,75)            the figure-8's LEFT loop, upper half
     3  (50,75) -> (20,270)     transit SOUTH down the west side of the
                                vertical arm
     4  three r55 semicircle arcs at centre (75,270): W->E under, E->W over,
                                W->E under = ONE AND A HALF laps of the DONUT
                                circle. Entered heading south, left heading
                                north, so there is no cusp at either end.
     5  (130,270) -> (122,150)  transit NORTH back up the east side of the arm
     6  -> (180,104) -> X       closes the LEFT loop's lower half

   Steps 2/3/5/6 together are the left loop, so the two loops genuinely CROSS
   at X and the course reads as a figure-8 over a donut rather than as a
   lap-and-a-detour. Everything stays inside the L: x 5..399 after the 30px
   stroke (the motorcycle park starts at 404) and y 19..340.                 */
var DRIFT_PATH =
  'M 220 75 C 300 20, 384 20, 384 75 C 384 130, 300 130, 220 75 ' +
  'C 140 20, 50 20, 50 75 C 44 108, 30 140, 24 190 C 20 220, 20 245, 20 270 ' +
  'A 55 55 0 0 0 130 270 A 55 55 0 0 0 20 270 A 55 55 0 0 0 130 270 ' +
  'C 130 230, 126 185, 122 150 C 118 120, 150 118, 180 104 ' +
  'C 200 96, 208 82, 220 75 Z';
(function () {
  var svg = svgNS('svg', { width: 470, height: 365, viewBox: '0 0 470 365',
    style: 'position:absolute;left:0;top:0;transform:translateZ(3px)', class: 'flat' }, zDrift);
  svg.style.background = 'none';
  /* road stroke FOLLOWS the same single path. Narrowed 40 -> 30 so the
     figure-8 crossing and the donut's entry/exit lanes stay legible instead
     of merging into one grey mass. */
  svgNS('path', { d: DRIFT_PATH, fill: 'none', stroke: '#c0c3c6', 'stroke-width': 30,
                  'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);
  svgNS('path', { d: DRIFT_PATH, fill: 'none', stroke: '#d8dadc', 'stroke-width': 1.5,
                  'stroke-dasharray': '10 12' }, svg);

  /* selection glow traced on the L outline */
  var gsvg = svgNS('svg', { width: 470, height: 365, viewBox: '0 0 470 365',
    class: 'zglowsvg' }, zDrift);
  svgNS('path', { d: 'M -8 -8 L 478 -8 L 478 158 L 158 158 L 158 373 L -8 373 Z',
    fill: 'none', stroke: '#efa227', 'stroke-width': 2.5, 'stroke-linejoin': 'round',
    opacity: '.9' }, gsvg);

  /* SIX karts, each with 4 trail ghosts, staggered evenly round the lap.
     Negative delays: the lead kart carries the largest negative delay so its
     ghosts sit behind it on the path.

     SPEED: the course is ~1534px against v3's ~1222px perimeter loop. v3 ran
     9s => ~136 px/s. The target here is ~60% of that ground speed (~81 px/s),
     so the lap is 19s (and 13.4s when the zone is active — see the CSS). The
     karts therefore cover more course but read noticeably slower.
     The ghost stagger is scaled with the lap so the trail keeps its v3 length
     in PIXELS rather than collapsing onto the kart.                          */
  var KART_DUR  = 19;                       /* must match the .kart CSS --dur */
  var kartAcc   = ['#efa227', '#3f7fd6', '#c8443a', '#3f9d6d', '#8a6bc4', '#d9564a'];
  var kartHelm  = ['#f4f7f9', '#ffd873', '#eef1f3', '#ffd2dc', '#cfeaff', '#fff0c2'];
  var ghost     = [0, .17, .34, .51];       /* trail stagger, seconds     */
  var cls       = ['lead', 't1', 't2', 't3'];
  var DRV       = '<i class="drv-s"></i><i class="drv-h"></i>';
  /* the kart plane is lifted clear of the 30px road stroke (z 3) so the karts
     and their trails always read on top of the tarmac */
  for (var k = 0; k < 6; k++) {
    var set   = el('kartset', 'transform:translateZ(6px)', zDrift);
    var phase = k * (KART_DUR / 6);
    var tint  = ';--drift:' + (16 + k * 3) + 'deg;--accent:' + kartAcc[k] +
                ';--helm:' + kartHelm[k];
    for (var g = 3; g >= 0; g--) {
      el('kart ' + cls[g],
        '--path:path("' + DRIFT_PATH + '");--dly:' + (-(phase + 1.2 - ghost[g])).toFixed(2) +
        's' + tint, set).innerHTML = DRV;
    }
    el('kart t4',
      '--path:path("' + DRIFT_PATH + '");--dly:' + (-(phase + 1.2 - .68)).toFixed(2) +
      's' + tint, set).innerHTML = DRV;
  }
})();

  label(gLiftB1, LOBBY.x + LOBBY.w / 2, LOBBY.y - 18, 42, 'Lift Lobby A', 'sm');
  label(gLiftB1, LOBBY.x + LOBBY.w / 2, LOBBY.y + LOBBY.h + 18, 6, 'tap to change level', 'sm det');
  return b;
})();

/* ==========================================================================
   4.  CAMERA ENGINE
   --------------------------------------------------------------------------
   State {tx,ty,scale,rz,rx}. One rAF loop drives:
     - the active tween (easeInOutCubic, interruptible)
     - the idle breathing (scale 1.000 -> 1.006, 6s sine) composited on top,
       damped to zero while the user is drag-orbiting so the two never fight
     - the wall-quadrant class swap that keeps every box solid through 360deg
   ========================================================================== */
/* --- MOTION PROFILES ------------------------------------------------------
   TOUCH  : ~1100ms flights, deeper zoom per zone (small-screen legibility).
   DESKTOP: 1600ms cinematic flights, keyframe scales as authored.           */
var PROFILE = {
  touch:   { dur: 1100, zoom: 1.30 },
  desktop: { dur: 1600, zoom: 1.00 }
};
var DUR   = PROFILE.desktop.dur;
var BREATHE_PERIOD = 6000;
var BREATHE_AMP    = 0.006;

var cur   = { tx: 0, ty: 0, scale: 0, rz: 0, rx: 0 };   /* live state       */
var from  = null, to = null, t0 = 0, tweening = false;
var fit   = 1, zoomBoost = 1, bias = { x: 0, y: 0 }, ovBias = 0, ovZoom = 1;
var lastCS = -1, lastRZ = 999, lastRX = 999;
var breathK = 1;                                        /* 1 = breathing on */

var mqCoarse  = window.matchMedia('(pointer: coarse), (hover: none)');
var mqDesktop = window.matchMedia('(min-width: 900px) and (min-height: 560px)');

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

/* responsive framing: keyframe scales stay pure, the viewport supplies `fit`,
   the motion profile supplies flight duration and the zone zoom multiplier   */
function measure() {
  var vw = window.innerWidth, vh = window.innerHeight;
  var phoneLayout = !mqDesktop.matches;            /* bottom dock is showing  */
  var touch = mqCoarse.matches || phoneLayout;

  DUR = touch ? PROFILE.touch.dur : PROFILE.desktop.dur;

  fit = Math.min(vw / 1550, vh / 980);
  fit = Math.max(0.34, Math.min(1.20, fit));

  /* zone poses zoom harder on phones so blocks stay legible at 390px */
  zoomBoost = (phoneLayout ? 1.62 : 1) * (touch ? PROFILE.touch.zoom : PROFILE.desktop.zoom);

  /* keep the subject clear of the chrome: phone = title pill above,
     card + preset row + chip bar below; desktop = panel left, card
     bottom-right, preset cluster top-right */
  bias = phoneLayout ? { x: 0,  y: -(vh < 560 ? 40 : 104) }
                     : { x: 74, y: -26 };
  ovBias = phoneLayout ? -66 : 0;   /* lift the overview into the band between title and dock */
  ovZoom = phoneLayout ? 1.45 : 1;  /* the compact real-plan site needs a closer overview on portrait */
}

/* resolve a keyframe row into a concrete camera state for this viewport */
function resolve(kf) {
  var isOverview = (kf.id === 'overview');
  var s = kf.scale * fit * (isOverview ? ovZoom : zoomBoost);
  return {
    tx: kf.tx * fit * (isOverview ? ovZoom : zoomBoost) + (isOverview ? 0 : bias.x),
    ty: kf.ty * fit * (isOverview ? ovZoom : zoomBoost) + (isOverview ? ovBias : bias.y),
    scale: s, rz: kf.rz, rx: kf.rx
  };
}

/* choose the equivalent target angle nearest the current one, so a dragged
   world never unwinds the long way round */
function nearestAngle(target, from_) {
  var a = target;
  while (a - from_ >  180) a -= 360;
  while (a - from_ < -180) a += 360;
  return a;
}

function flyTo(kf) {
  /* a flight always wins over a hand-thrown coast, and re-arms the preset
     highlight that free orbiting switched off */
  momActive = false;
  freeOrbit = false;
  from = { tx: cur.tx, ty: cur.ty, scale: cur.scale, rz: cur.rz, rx: cur.rx };
  to   = resolve(kf);
  to.rz = nearestAngle(to.rz, cur.rz);
  t0   = performance.now();
  tweening = true;
  syncViewBtns();
}

function frame(now) {
  if (tweening) {
    var p = (now - t0) / DUR;
    if (p >= 1) { p = 1; tweening = false; }
    var e = easeInOutCubic(p);
    cur.tx    = from.tx    + (to.tx    - from.tx)    * e;
    cur.ty    = from.ty    + (to.ty    - from.ty)    * e;
    cur.scale = from.scale + (to.scale - from.scale) * e;
    cur.rz    = from.rz    + (to.rz    - from.rz)    * e;
    cur.rx    = from.rx    + (to.rx    - from.rx)    * e;
  } else if (momActive) {
    /* post-release coast: decay the thrown angular velocity to zero over
       MOMENTUM_MS on a squared ease-out, integrated against REAL frame time
       so the throw feels the same at 60Hz and 120Hz. */
    var mp  = (now - momT0) / MOMENTUM_MS;
    var mdt = now - momLast;
    momLast = now;
    if (mp >= 1) { momActive = false; }
    else {
      var mk = (1 - mp) * (1 - mp);
      cur.rz  = cur.rz + momVZ * mk * mdt;
      cur.rx  = clampRX(cur.rx + momVX * mk * mdt);
    }
  }
  /* idle breathing rides on top of the tweened scale, never replaces it.
     breathK is damped to 0 for the whole drag AND the coast that follows it,
     so the jitter can never fight the hand.                                 */
  breathK += (((dragMoved || momActive) ? 0 : 1) - breathK) * 0.10;
  var breath = 1 + BREATHE_AMP * 0.5 * breathK *
               (1 - Math.cos(2 * Math.PI * (now % BREATHE_PERIOD) / BREATHE_PERIOD));

  camera.style.transform =
    'translate(' + cur.tx.toFixed(2) + 'px,' + cur.ty.toFixed(2) + 'px) scale(' +
    (cur.scale * breath).toFixed(5) + ')';
  world.style.transform =
    'rotateX(' + cur.rx.toFixed(3) + 'deg) rotateZ(' + cur.rz.toFixed(3) + 'deg)';

  /* label billboarding + zoom compensation: only write vars when they move */
  if (Math.abs(cur.rz - lastRZ) > 0.01 || Math.abs(cur.rx - lastRX) > 0.01) {
    world.style.setProperty('--crz', (-cur.rz).toFixed(2) + 'deg');
    world.style.setProperty('--crx', (-cur.rx).toFixed(2) + 'deg');
    /* swap which two side quads each box draws, by camera quadrant */
    var n = ((cur.rz % 360) + 540) % 360 - 180;          /* -180 .. 180 */
    document.body.classList.toggle('wall-n', Math.abs(n) > 90);
    document.body.classList.toggle('wall-e', n > 0);
    lastRZ = cur.rz; lastRX = cur.rx;
  }
  if (Math.abs(cur.scale - lastCS) > 0.002) {
    world.style.setProperty('--cs', cur.scale.toFixed(4));
    document.body.classList.toggle('z-near', cur.scale > 0.62);
    document.body.classList.toggle('z-far', cur.scale < 0.40);
    lastCS = cur.scale;
  }
  requestAnimationFrame(frame);
}

/* ==========================================================================
   5.  SELECTION GRAMMAR
   ========================================================================== */
var ZONES = ['zSquare', 'zGalleria', 'zDrift', 'zDisplay'];
var cardEl    = document.getElementById('card');
var cardKick  = document.getElementById('cardKick');
var cardTitle = document.getElementById('cardTitle');
var cardList  = document.getElementById('cardList');
var current   = null;

function select(kf) {
  current = kf;

  /* zone glow + dim the rest to 60% */
  ZONES.forEach(function (id) {
    var z = document.getElementById(id);
    var active = (kf.zone === id);
    z.classList.toggle('is-active', active);
    z.style.setProperty('--oz', kf.zone ? (active ? 1 : 0.6) : 1);
  });
  /* non-zone furniture dims too when a zone on that level is picked */
  var surfaceDim = (kf.zone && !kf.xray) ? 0.6 : 1;
  gGround.style.setProperty('--oz', surfaceDim);
  gMall.style.setProperty('--oz', surfaceDim);
  gB1ctx.style.setProperty('--oz', (kf.zone && kf.xray) ? 0.6 : 1);

  /* x-ray: whole surface group down to 12%, basement revealed */
  document.body.classList.toggle('xray', !!kf.xray);

  /* legend chip state */
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) {
    c.classList.toggle('on', c.dataset.id === kf.id);
    c.setAttribute('aria-pressed', c.dataset.id === kf.id ? 'true' : 'false');
  });

  /* info card */
  if (kf.id === 'overview') {
    cardEl.classList.remove('show');
  } else {
    cardEl.style.setProperty('--accent', kf.accent);
    cardKick.textContent  = kf.kick;
    cardTitle.textContent = kf.title;
    cardList.innerHTML = '';
    kf.bullets.forEach(function (b) {
      var li = document.createElement('li'); li.textContent = b; cardList.appendChild(li);
    });
    cardEl.classList.add('show');
  }
  flyTo(kf);
}

function go(id) {
  var kf = ALL_KF.filter(function (k) { return k.id === id; })[0];
  if (kf) select(kf);
}

/* ==========================================================================
   6.  LEGEND UI
   ========================================================================== */
var chips = document.getElementById('chips');
KEYFRAMES.forEach(function (kf) {
  var li = document.createElement('li');
  var b  = document.createElement('button');
  b.type = 'button';
  b.className = 'chip';
  b.dataset.id = kf.id;
  b.style.setProperty('--accent', kf.accent);
  b.setAttribute('aria-pressed', 'false');
  b.innerHTML = '<span class="swatch"></span><span class="txt">' +
                '<span class="nm"></span><span class="ds"></span></span>';
  b.querySelector('.nm').textContent = kf.name;
  b.querySelector('.ds').textContent = kf.desc;
  b.addEventListener('click', function () { select(kf); });
  li.appendChild(b);
  chips.appendChild(li);
});

/* ==========================================================================
   7.  CAMERA VIEW PRESETS
   --------------------------------------------------------------------------
   Ed asked to be able to orientate the model "like a sphere". The decision is
   presets + drag rather than a free trackball, so the map never ends up in an
   unreadable pose. A preset changes ONLY rx / rz — the pan and zoom of the
   active keyframe are left exactly where they are — and always tweens.

   rx is the tilt AWAY from a straight-down plan view: rx 0 = looking straight
   down, rx 58 = the authored iso pose, rx 90 = ground level. Bird's eye is
   therefore a LOW rx, not a high one.
   ========================================================================== */
var VIEWS = {
  iso:  { rx: 58, rz: -38 },     /* authored isometric default               */
  bird: { rx: 16, rz: null },    /* near plan view; null rz = keep current   */
  flip: { rx: 58, rz:  52 }      /* default rz rotated +90: opposite faces   */
};
var viewBtns = Array.prototype.slice.call(document.querySelectorAll('.vbtn'));

function setViewBtn(id) {
  viewBtns.forEach(function (b) {
    var on = (b.dataset.view === id);
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}
function syncViewBtns() {
  var rx = to ? to.rx : cur.rx, rz = to ? to.rz : cur.rz;
  var n = ((rz % 360) + 540) % 360 - 180;
  var match = null;
  if (Math.abs(rx - VIEWS.iso.rx)  < 0.6 && Math.abs(n - VIEWS.iso.rz)  < 0.6) match = 'iso';
  else if (Math.abs(rx - VIEWS.flip.rx) < 0.6 && Math.abs(n - VIEWS.flip.rz) < 0.6) match = 'flip';
  else if (Math.abs(rx - VIEWS.bird.rx) < 0.6) match = 'bird';
  setViewBtn(match);
}
function applyView(id) {
  var v = VIEWS[id];
  if (!v) return;
  momActive = false;
  freeOrbit = false;
  var targetRz = (v.rz === null) ? cur.rz : nearestAngle(v.rz, cur.rz);
  from = { tx: cur.tx, ty: cur.ty, scale: cur.scale, rz: cur.rz, rx: cur.rx };
  to   = { tx: cur.tx, ty: cur.ty, scale: cur.scale, rz: targetRz, rx: v.rx };
  t0   = performance.now();
  tweening = true;
  setViewBtn(id);
}
viewBtns.forEach(function (b) {
  b.addEventListener('click', function () { applyView(b.dataset.view); });
});

/* ==========================================================================
   8.  DRAG TO ORBIT  (v4 — fluid, two-axis, with momentum)
   --------------------------------------------------------------------------
   v3 was "dead locked": horizontal only, 0.35deg/px, hard stop on release,
   and a mostly-vertical first move killed the gesture outright. Now:

     a  horizontal drag spins rz at 0.45deg/px
     b  vertical drag tilts rx at 0.30deg/px, CLAMPED to 22..70deg so the
        world can never be dragged past a plan view or below the horizon.
        Drag UP to stand the camera up (rx grows), same sense as a map app.
     c  releasing carries the angular velocity and decays it to zero over
        MOMENTUM_MS (600ms) on a squared ease-out, so the world coasts
     d  grab / grabbing cursors, desktop only (see the CSS media query)
     e  the gesture starts ANYWHERE on the stage, including on top of the
        world and on the lift lobby. It still has to clear DRAG_THRESHOLD
        (6px, either axis) before it counts, so taps are never stolen, and
        #hud / #card / #views are excluded outright
     f  idle breathing is damped to zero for the whole drag AND coast, so it
        never fights the hand (see frame())
     g  once the user has orbited by hand, NO view preset is shown as active
        until one is actually pressed (freeOrbit, cleared by flyTo/applyView)
   ========================================================================== */
var DRAG_DEG_PER_PX = 0.45;      /* rz: horizontal */
var DRAG_RX_PER_PX  = 0.30;      /* rx: vertical   */
var DRAG_THRESHOLD  = 6;
var RX_MIN = 22, RX_MAX = 70, MOMENTUM_MS = 600;
var VEL_SMOOTH = 0.35;           /* new-sample weight in the velocity filter */
var VEL_MIN    = 0.004;          /* deg/ms below which a release is a stop   */

var dragActive = false, dragMoved = false, dragId = null;
var dragX0 = 0, dragY0 = 0, dragRZ0 = 0, dragRX0 = 0, suppressClick = false;
var lastPX = 0, lastPY = 0, lastPT = 0, velRZ = 0, velRX = 0;
var momActive = false, momT0 = 0, momLast = 0, momVZ = 0, momVX = 0;
var freeOrbit = false;           /* user has orbited by hand since the last preset/chip */

/* The Bird's-eye preset parks rx at 16, BELOW the drag floor. Clamping hard to
   RX_MIN would pop the world on the first vertical move out of that pose, so
   each gesture takes its floor from wherever it started. Normal orbiting still
   lives in 22..70; only a pose that was already flatter keeps its own floor. */
var rxFloor = RX_MIN;
function clampRX(v) { return v < rxFloor ? rxFloor : (v > RX_MAX ? RX_MAX : v); }
function stopMomentum() { momActive = false; }

stage.addEventListener('pointerdown', function (e) {
  if (e.button && e.button !== 0) return;
  if (e.target.closest('#hud') || e.target.closest('#card') || e.target.closest('#views')) return;
  stopMomentum();
  dragActive = true; dragMoved = false; dragId = e.pointerId;
  dragX0 = lastPX = e.clientX;
  dragY0 = lastPY = e.clientY;
  dragRZ0 = cur.rz; dragRX0 = cur.rx;
  rxFloor = Math.min(RX_MIN, cur.rx);
  lastPT = performance.now();
  velRZ = velRX = 0;
});
stage.addEventListener('pointermove', function (e) {
  if (!dragActive || e.pointerId !== dragId) return;
  var dx = e.clientX - dragX0, dy = e.clientY - dragY0;
  if (!dragMoved) {
    /* threshold on EITHER axis — v3 abandoned the gesture on a vertical lead,
       which is what made the tilt feel non-existent */
    if (Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
    dragMoved = true;
    freeOrbit = true;
    tweening = false;
    document.body.classList.add('dragging');
    try { stage.setPointerCapture(dragId); } catch (err) {}
  }
  /* instantaneous velocity in deg/ms, low-pass filtered so one jittery
     sample at release cannot fling the world */
  var now = performance.now(), dt = now - lastPT;
  if (dt > 0) {
    var iz =  (e.clientX - lastPX) * DRAG_DEG_PER_PX / dt;
    var ix = -(e.clientY - lastPY) * DRAG_RX_PER_PX  / dt;
    velRZ = velRZ * (1 - VEL_SMOOTH) + iz * VEL_SMOOTH;
    velRX = velRX * (1 - VEL_SMOOTH) + ix * VEL_SMOOTH;
    lastPX = e.clientX; lastPY = e.clientY; lastPT = now;
  }
  /* absolute mapping from the gesture origin: no drift, no accumulated error */
  cur.rz = dragRZ0 + dx * DRAG_DEG_PER_PX;
  cur.rx = clampRX(dragRX0 - dy * DRAG_RX_PER_PX);
  syncViewBtns();
});
function endDrag() {
  if (!dragActive) return;
  dragActive = false;
  if (dragMoved) {
    suppressClick = true;
    setTimeout(function () { suppressClick = false; }, 0);
    /* coast: hand the filtered velocity to the frame loop to decay */
    if (Math.abs(velRZ) > VEL_MIN || Math.abs(velRX) > VEL_MIN) {
      momVZ = velRZ; momVX = velRX;
      momT0 = momLast = performance.now();
      momActive = true;
    }
  }
  dragMoved = false;
  document.body.classList.remove('dragging');
  try { stage.releasePointerCapture(dragId); } catch (err) {}
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('lostpointercapture', endDrag);

/* Once the world has been orbited by hand it matches no preset, so the
   cluster shows nothing active until a preset (or a chip) is pressed. */
(function patchSync() {
  var orig = syncViewBtns;
  syncViewBtns = function () {
    if (freeOrbit) { setViewBtn(null); return; }
    orig();
  };
})();

/* ==========================================================================
   9.  LIFT LOBBY A — LEVEL LINK
   --------------------------------------------------------------------------
   Clickable on BOTH levels. One click: toggle the x-ray, fly to the other
   level's lobby-centred internal keyframe, and flash a glowing vertical shaft
   at the lobby position that fades over ~900ms.
   ========================================================================== */
var shaft = null, shaftTimer = null;
function showShaft() {
  if (!shaft) {
    shaft = el('shaft', 'position:absolute;left:0;top:0;width:0;height:0;' +
                        'transform-style:preserve-3d', gLink);
    var cx = LOBBY.x + LOBBY.w / 2, cy = LOBBY.y + LOBBY.h / 2;
    /* core + halo scaled with the v4 80% lobby block so the shaft still lands
       inside the smaller footprint */
    box(shaft, cx - 14, cy - 14, 28, 28, 238,
        'transform:translateZ(-106px);--faceT:rgba(96,150,235,.55);' +
        '--faceA:rgba(96,150,235,.30);--faceB:rgba(96,150,235,.42)');
    box(shaft, cx - 27, cy - 27, 54, 54, 232,
        'transform:translateZ(-103px);--faceT:rgba(96,150,235,.13);' +
        '--faceA:rgba(96,150,235,.08);--faceB:rgba(96,150,235,.11)');
  }
  shaft.classList.add('snap', 'lit');
  void shaft.offsetWidth;                 /* commit --ol:1 with no transition */
  shaft.classList.remove('snap');
  clearTimeout(shaftTimer);
  shaftTimer = setTimeout(function () { shaft.classList.remove('lit'); }, 80);
}

function lobbyJump() {
  var goingDown = !document.body.classList.contains('xray');
  showShaft();
  go(goingDown ? 'lobbyB1' : 'lobbyL1');
}
[liftL1, liftB1].forEach(function (b) {
  b.addEventListener('click', function (e) {
    e.stopPropagation();
    if (suppressClick) return;
    lobbyJump();
  });
  b.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); lobbyJump(); }
  });
});

/* ==========================================================================
   10. STAGE CLICK / KEYBOARD
   --------------------------------------------------------------------------
   A click on empty stage returns home. The KEYFRAMES machinery stays
   device-agnostic: a render can still walk the table row by row (fit = 1,
   zoom boost = 1, bias = 0) to produce the promo video.
   ========================================================================== */
stage.addEventListener('click', function (e) {
  if (suppressClick) return;
  if (e.target.closest('#hud') || e.target.closest('#card') || e.target.closest('#views')) return;
  if (e.target.closest('.liftlink')) return;
  go('overview');
});

document.addEventListener('keydown', function (e) {
  var kf = KEYFRAMES.filter(function (k) { return k.key === e.key; })[0];
  if (kf) { select(kf); return; }
  if (e.key === 'Escape') { go('overview'); }
});

/* ==========================================================================
   11. BOOT
   ========================================================================== */
measure();
var start = resolve(KEYFRAMES[0]);
cur.tx = start.tx; cur.ty = start.ty; cur.rz = start.rz; cur.rx = start.rx;
cur.scale = start.scale * 0.86;              /* small settle-in on first paint */
world.style.setProperty('--cs', cur.scale.toFixed(4));
requestAnimationFrame(frame);
select(KEYFRAMES[0]);

var rzTimer = null;
function reframe() {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(function () {
    measure();
    if (current) flyTo(current);
  }, 120);
}
window.addEventListener('resize', reframe);
window.addEventListener('orientationchange', reframe);
if (mqDesktop.addEventListener) {
  mqDesktop.addEventListener('change', reframe);
  mqCoarse.addEventListener('change', reframe);
}

})();
</script>

<!--
================================================================================
MANUAL QA CHECKLIST — TRACKSIDE motion prototype (v4, client revision pass)
================================================================================
Phone portrait is the PRIMARY case (QR code at the mall). Test 1 to 6 on a
390 x 844 viewport first, then repeat on desktop.

 1. PHONE THUMB PASS (390px portrait) — the view preset row sits directly above
    the chip bar; every chip is at least 46px tall and reachable one-handed; the
    chip bar scrolls horizontally through all five; the title pill, info card,
    preset row and chip bar never overlap; no text wraps badly, clips or
    overflows. On desktop the preset cluster docks top-right instead.
 2. FLOOR-PLAN READ — at overview the site reads as Ed's plan: south entrance
    and taxi stand at the far WEST, the indoor spine running west to east,
    South Galleria 4A + 4B on the spine near the west end, Lift Lobby A on the
    spine's south side about HALFWAY along (v4: it moved east), the octagon
    with its pyramid at the east end labelled OFFICIAL F1 MERCHANDISE with the
    merch stall standing inside it, and Monument Square outdoors to the
    NORTH-EAST. There is no "The Great Hall" label and no separate merch booth
    on the spine. Retail units stay faded and unnumbered; zones pop.
 3. LEGEND SWEEP — tap chips 1 to 5 in order, then back. Flights are ~1.1s on
    touch and ~1.6s on desktop, eased, and every pose visibly changes pan, zoom
    AND angle (a drone move, never a slide or a snap). Zones fill the frame.
 4. INTERRUPT — tap a chip while another flight is mid-air. The camera retargets
    smoothly from wherever it is: no jump back to the old pose, no double-tween.
    Repeat rapidly 5 or 6 times.
 5. X-RAY HANDOFF — go Monument Square -> B1 Dorifto -> B1 Car Display ->
    South Galleria. Ground and mall fade to ~12% and the basement lights up over
    ~0.6s on the way down, and fully restore on the way back up. No flicker, no
    stuck state. The B1 vendor market is GONE.
 6. VIEW PRESETS — tap 45 / Bird's eye / 45 flip on every pose. Each tween moves
    ONLY the angle: the subject stays roughly framed, pan and zoom do not jump.
    Bird's eye drops to a near plan view (rx 16); 45 flip swings rz to +52 so the
    OPPOSITE faces of every box are the ones drawn — check no box turns hollow or
    inside out at any point of the transition, including the moment it crosses
    rz 0. Selecting a chip re-normalises the angle and the preset highlight.
 7. DRAG TO ORBIT (v4 — the big interaction change) — with a mouse and with a
    finger, and starting the gesture ANYWHERE on the stage including directly
    on top of the world and on the lift lobby block:
      a  horizontal drag spins rz at ~0.45deg/px and follows the hand 1:1
      b  vertical drag TILTS: rx follows at ~0.30deg/px, drag up to stand the
         camera up. It must stop dead at 22deg and at 70deg — keep dragging
         past the clamp and nothing further happens, no snap, no overshoot
      c  flick and let go: the world COASTS and comes to rest in ~600ms. A
         slow release with no speed must not coast at all
